name: run-kaggle-job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique job id"
        required: true
        type: string
      smiles:
        description: "SMILES string"
        required: true
        type: string
      email:
        description: "Email to notify"
        required: true
        type: string

permissions:
  contents: write   # allow committing results back

env:
  DS_SLUG: polymer-job-inputs
  DS_TITLE: Polymer Job Inputs
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          pip install kaggle
          kaggle --version

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Prepare input dataset folder
        run: |
          rm -rf kaggle_inputs && mkdir -p kaggle_inputs
          # CSV the kernel reads
          cat > kaggle_inputs/input.csv <<EOF
          job_id,SMILES
          ${{ github.event.inputs.job_id }},${{ github.event.inputs.smiles }}
          EOF

          # optional request JSON (kept as you wanted)
          cat > "kaggle_inputs/job-${{ github.event.inputs.job_id }}.json" <<EOF
          {"job_id":"${{ github.event.inputs.job_id }}","SMILES":"${{ github.event.inputs.smiles }}","email":"${{ github.event.inputs.email }}","ts_utc":"${{ github.run_started_at }}"}
          EOF

          # dataset-metadata.json bound to THIS account
          cat > kaggle_inputs/dataset-metadata.json <<EOF
          {
            "title": "${DS_TITLE}",
            "id": "${{ secrets.KAGGLE_USERNAME }}/${DS_SLUG}",
            "licenses": [{"name": "CC0-1.0"}]
          }
          EOF

      - name: Create or version the micro-dataset (owner = your API user)
        shell: bash
        run: |
          set -e
          DS_ID="${KAGGLE_USERNAME}/${DS_SLUG}"
          echo "Using DS_ID=$DS_ID"
          # Does the dataset already exist for this owner?
          if kaggle datasets files -d "$DS_ID" >/dev/null 2>&1; then
            echo "Dataset exists → versioning"
            kaggle datasets version -p kaggle_inputs --dir-mode zip -m "job ${{ github.event.inputs.job_id }}"
          else
            echo "Creating dataset"
            if ! kaggle datasets create -p kaggle_inputs --dir-mode zip; then
              echo "Create failed (probably title collision). Versioning instead."
              kaggle datasets version -p kaggle_inputs --dir-mode zip -m "job ${{ github.event.inputs.job_id }}"
            fi
          fi

      - name: Wait for dataset to propagate & verify
        shell: bash
        run: |
          set -e
          DS_ID="${KAGGLE_USERNAME}/${DS_SLUG}"
          for i in {1..30}; do
            if kaggle datasets files -d "$DS_ID" | grep -q 'input.csv'; then break; fi
            sleep 4
          done
          mkdir -p check
          kaggle datasets download -d "$DS_ID" -f input.csv -p check --force
          echo "Top of downloaded input.csv:"
          head -n 5 check/input.csv

      - name: Verify dataset contains our input.csv
        run: |
          kaggle datasets files -d fridaycode/polymer-job-inputs || true
          mkdir -p check && kaggle datasets download -d fridaycode/polymer-job-inputs -f input.csv -p check
          ls -l check
          echo "Top of downloaded input.csv:"
          head -n 5 check/input.csv

      - name: Ensure kernel metadata exists
        run: |
          test -f kaggle_kernel/kernel-metadata.json
          test -f kaggle_kernel/neurips-polymer-predict.ipynb
      
      - name: Point kernel to the same job-inputs dataset ID
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("kaggle_kernel/kernel-metadata.json")
          data = json.loads(p.read_text())
          ds_id = f"{os.environ['KAGGLE_USERNAME']}/{os.environ['DS_SLUG']}"
          srcs = set(data.get("dataset_sources", []))
          srcs.add(ds_id)
          data["dataset_sources"] = sorted(srcs)
          p.write_text(json.dumps(data, indent=2))
          print("dataset_sources:", data["dataset_sources"])
          PY

      - name: Push & run the kernel
        run: |
          # Uploads metadata + notebook and runs it
          kaggle kernels push -p kaggle_kernel

      - name: Poll kernel status
        shell: bash
        run: |
          set -e
          KERNEL_ID="fridaycode/neurips-polymer-predict"
          for i in {1..60}; do
            STATUS=$(kaggle kernels status "$KERNEL_ID" | tr -d '\r')
            echo "Status: $STATUS"
            if echo "$STATUS" | grep -qi "complete"; then break; fi
            if echo "$STATUS" | grep -qi "error\|failed"; then echo "Kernel failed"; exit 1; fi
            sleep 15
          done

      - name: Download kernel outputs
        run: |
          mkdir -p outputs
          kaggle kernels output fridaycode/neurips-polymer-predict -p outputs || true
          echo "Outputs dir:"
          ls -la outputs
          if [ -f outputs/output.json ]; then
            cp outputs/output.json results.json
          else
            echo '{"error":"no-output"}' > results.json
          fi

      - name: Create result JSON
        run: |
          if [ -f outputs/output.json ]; then
            cp outputs/output.json results.json
          elif [ -f outputs/output.csv ]; then
            python -c "import pandas as pd, json; df = pd.read_csv('outputs/output.csv'); json.dump(df.iloc[0].to_dict(), open('results.json','w'))"
          else
            echo '{"error":"no-output"}' > results.json
          fi

      - name: Commit result file back to repo
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          EMAIL:  ${{ github.event.inputs.email }}
        run: |
          mkdir -p results
          JOB_FILE="job-${JOB_ID}.json"
          cp results.json "results/${JOB_FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "results/${JOB_FILE}"
          git commit -m "results: ${JOB_FILE} email=${EMAIL}" || echo "No changes"
          git push
      
      - name: (Optional) Attach result JSON to dataset
        env:
          DS_ID: ${{ secrets.KAGGLE_USERNAME }}/$DS_SLUG
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          cp results.json "kaggle_inputs/job-${JOB_ID}.result.json"
          kaggle datasets version -p kaggle_inputs --dir-mode zip -m "result ${JOB_ID}"
