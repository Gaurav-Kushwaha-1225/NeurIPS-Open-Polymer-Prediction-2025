name: run-kaggle-job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique job id"
        required: true
        type: string
      smiles:
        description: "SMILES string"
        required: true
        type: string
      email:
        description: "Email to notify"
        required: true
        type: string

permissions:
  contents: write   # allow committing results back

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Prepare input dataset folder
        run: |
          rm -rf kaggle_inputs && mkdir -p kaggle_inputs
          # Header MUST be SMILES (uppercase) because the notebook reads df['SMILES']
          cat > kaggle_inputs/input.csv <<EOF
          job_id,SMILES
          ${{ github.event.inputs.job_id }},${{ github.event.inputs.smiles }}
          EOF
          # IMPORTANT: own the dataset under the same account as the API key
          cat > kaggle_inputs/dataset-metadata.json <<EOF
          {
            "title": "Polymer Job Inputs",
            "id": "${KAGGLE_USERNAME}/polymer-job-inputs",
            "licenses": [{"name": "CC0-1.0"}]
          }
          EOF
          echo "Created kaggle_inputs/input.csv:"; cat kaggle_inputs/input.csv

      - name: Create-or-version the micro dataset
        shell: bash
        run: |
          set -e
          DS="${KAGGLE_USERNAME}/polymer-job-inputs"
          echo "Target dataset: $DS"
          # Try create once; if it already exists, version it
          if kaggle datasets create -p kaggle_inputs; then
            echo "Created dataset $DS"
          else
            kaggle datasets version -p kaggle_inputs -m "job ${{ github.event.inputs.job_id }}"
            echo "Versioned dataset $DS"
          fi

      - name: Wait for dataset to propagate & verify
        shell: bash
        run: |
          set -e
          DS="${KAGGLE_USERNAME}/polymer-job-inputs"
          mkdir -p check
          # Wait until Kaggle shows input.csv in the latest version
          for i in {1..30}; do
            if kaggle datasets files -d "$DS" | grep -q 'input.csv'; then
              break
            fi
            echo "Waiting for $DS to expose input.csv ..."; sleep 5
          done
          kaggle datasets download -d "$DS" -f input.csv -p check
          echo "Downloaded file:"
          ls -l check/input.csv
          echo "Top of input.csv:"
          head -n 5 check/input.csv

      - name: Verify dataset contains our input.csv
        run: |
          kaggle datasets files -d fridaycode/polymer-job-inputs || true
          mkdir -p check && kaggle datasets download -d fridaycode/polymer-job-inputs -f input.csv -p check
          ls -l check
          echo "Top of downloaded input.csv:"
          head -n 5 check/input.csv

      - name: Ensure kernel metadata exists
        run: |
          test -f kaggle_kernel/kernel-metadata.json
          test -f kaggle_kernel/neurips-polymer-predict.ipynb

      - name: Push & run the kernel
        run: |
          # Uploads metadata + notebook and runs it
          kaggle kernels push -p kaggle_kernel

      - name: Poll kernel status
        shell: bash
        run: |
          set -e
          KERNEL_ID="fridaycode/neurips-polymer-predict"
          for i in {1..60}; do
            STATUS=$(kaggle kernels status "$KERNEL_ID" | tr -d '\r')
            echo "Status: $STATUS"
            if echo "$STATUS" | grep -qi "complete"; then break; fi
            if echo "$STATUS" | grep -qi "error\|failed"; then echo "Kernel failed"; exit 1; fi
            sleep 15
          done

      - name: Download kernel outputs
        run: |
          mkdir -p outputs
          kaggle kernels output fridaycode/neurips-polymer-predict -p outputs || true
          echo "Outputs dir:"
          ls -la outputs
          if [ -f outputs/output.json ]; then
            cp outputs/output.json results.json
          else
            echo '{"error":"no-output"}' > results.json
          fi

      - name: Create result JSON
        run: |
          if [ -f outputs/output.json ]; then
            cp outputs/output.json results.json
          elif [ -f outputs/output.csv ]; then
            python -c "import pandas as pd, json; df = pd.read_csv('outputs/output.csv'); json.dump(df.iloc[0].to_dict(), open('results.json','w'))"
          else
            echo '{"error":"no-output"}' > results.json
          fi

      - name: Commit result file back to repo
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          EMAIL:  ${{ github.event.inputs.email }}
        run: |
          mkdir -p results
          cp results.json "results/${JOB_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/${JOB_ID}.json
          git commit -m "results: ${JOB_ID} email=${EMAIL}" || echo "No changes"
          git push
